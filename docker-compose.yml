services:
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
  frontend:
    build: .
    command: streamlit run frontend.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    env_file: .env
    depends_on: [api]
    environment:
      - NETOPS_API_URL=http://api:8000
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
